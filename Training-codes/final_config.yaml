# final_config.yaml — Office Inventory Detection (10 classes)
#
# CLASS INDEX (position = class_id, 0-indexed):
#   0  Conference Tables
#   1  Cubicles / Partitions
#   2  Desks
#   3  Filing Cabinets / Storage Units
#   4  Laptops
#   5  Monitors
#   6  Mouse
#   7  Office Chairs
#   8  Pedestals
#   9  Printers Scanners
#
# "Other" and "Telephones VoIP Phones" dropped: zero labeled instances in
# relevant_dataset as of this config. Re-add once labeled examples exist.
#
# Annotation format expected (one .txt per image, same stem as image):
#   [Image #1]
#   { "category": "Desks", "x1": 0.10, "y1": 0.20, "x2": 0.30, "y2": 0.45 }
#   { "category": "Office Chairs", "x1": 0.50, "y1": 0.30, "x2": 0.70, "y2": 0.80 }
#
# Coordinates are normalized (0-1). final_train.py converts to YOLO format in-place.

# ---------- Dataset ---------------------------------------------------------
dataset_dir: "/home/ronit/Downloads/relevant_dataset"

nc: 10
names:
  - "Conference Tables"
  - "Cubicles / Partitions"
  - "Desks"
  - "Filing Cabinets / Storage Units"
  - "Laptops"
  - "Monitors"
  - "Mouse"
  - "Office Chairs"
  - "Pedestals"
  - "Printers Scanners"

val_fraction: 0.2     # 20% held out for validation
split_seed: 42

# ---------- Model -----------------------------------------------------------
model_version: "yolo11"
model_size: "medium"       # was "large" — 8GB VRAM + 214 source images overfits/OOMs with l
pretrained_weights: null   # set to /path/to/weights.pt to resume/finetune

# ---------- Training --------------------------------------------------------
epochs: 100
batch_size: 16             # was 8 — headroom freed by dropping to medium
img_size: 640
device: "0"          # "0" = GPU 0 | "cpu" | "0,1" = multi-GPU
optimizer: "auto"

lr0: 0.01
lrf: 0.001
cos_lr: true
warmup_epochs: 5
warmup_momentum: 0.9
warmup_bias_lr: 0.1
weight_decay: 0.0005
momentum: 0.937

# ---------- Loss Weights ----------------------------------------------------
box: 6.5
cls: 2.5      # was 1.5 — extra push needed given severe class imbalance
dfl: 4.5

# ---------- YOLO Built-in Augmentation (applied on top of manual augment) ---
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.1    # was 0.0 — helps generalization on the underrepresented classes
copy_paste: 0.3   # was 0.0 — pastes rare-class instances onto other images to offset imbalance

# ---------- Training Settings -----------------------------------------------
patience: 30    # was 50 — dataset is small, will converge/plateau well before 50
iou: 0.5        # was 0.2 — NMS IoU threshold; 0.2 merges adjacent chairs/desks into one detection, hurting counting accuracy
amp: true
single_cls: false
resume: false
workers: 6
overlap_mask: true

# ---------- Output ----------------------------------------------------------
save_period: 10
plots: true
project: "runs"
experiment: "inventory_train"
